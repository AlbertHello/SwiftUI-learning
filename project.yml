name: ios-swift
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"

targets:
  ios-swift:
    type: application
    platform: iOS
    sources:
      - path: ios-swift
        excludes:
          - Resources/Info.plist
    resources:
      - path: ios-swift/Resources/Assets.xcassets
      - path: ios-swift/Preview Content/Preview Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.iosswift
        PRODUCT_NAME: ios-swift
        PRODUCT_MODULE_NAME: ios_swift
        INFOPLIST_FILE: ios-swift/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    scheme:
      gatherCoverageData: false
